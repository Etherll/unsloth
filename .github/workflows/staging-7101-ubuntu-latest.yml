# Disposable repro workflow. Delete after validation.

name: "staging-7101 ubuntu-latest exact 3cd6760c"

on:
  push:
    branches:
      - "pr-7101-final-3cd6760c-20260901t0604z-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install secret-free test dependencies"
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart

      - name: "Run exact-head sandbox suite under Bubblewrap"
        shell: bash
        run: |
          bwrap --ro-bind / / --unshare-all --die-with-parent /usr/bin/true
          UNSLOTH_STUDIO_SANDBOX_CI_ENFORCE=1 PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_bypass_permissions.py studio/backend/tests/test_sandbox.py studio/backend/tests/test_sandbox_profile_security.py studio/backend/tests/test_sandbox_warm_probe.py studio/backend/tests/test_tool_output_streaming.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda'

