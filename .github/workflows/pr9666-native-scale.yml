# Disposable repro workflow. Delete after validation.

name: "PR 9666 native scale"

on:
  push:
    branches:
      - "pr-9666-native-resume-20260908-70775b3b-ci"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: "Prepare exact target and probe"
        shell: pwsh
        run: |
          git worktree add --detach target 70775b3bdf147d10e941306c17c25d51d98a4bca
          if ($LASTEXITCODE) { throw "Exact target checkout failed" }
          git worktree add --detach baseline 5c44c8c96b7fad0777cb6ea1240e5427f81e6fe4
          if ($LASTEXITCODE) { throw "Exact baseline checkout failed" }
          New-Item -ItemType Directory -Force target/.codex/pr9666 | Out-Null
          Copy-Item .github/pr9666/* target/.codex/pr9666/
          git -C target rev-parse HEAD

      - name: "Frontend dependencies and build"
        shell: pwsh
        run: |
          Set-Location target/studio/frontend
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { throw "npm ci failed" }
          npm run build
          if ($LASTEXITCODE) { throw "Frontend build failed" }
          Set-Location ../../../baseline/studio/frontend
          New-Item -ItemType Junction -Path node_modules -Target (Resolve-Path ../../../target/studio/frontend/node_modules).Path | Out-Null
          npm run build
          if ($LASTEXITCODE) { throw "Baseline frontend build failed" }

      - name: "Install pinned CDP client in probe directory"
        shell: pwsh
        run: |
          npm install --prefix target/.codex/pr9666 --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
          if ($LASTEXITCODE) { throw "CDP client install failed" }

      - name: "Reuse verified current native app"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34191407996 --repo Etherll/unsloth --name pr9666-native-binary --dir native-binary
          if($LASTEXITCODE){throw 'Download failed'}
          $hash=(Get-FileHash native-binary/unsloth-studio.exe -Algorithm SHA256).Hash
          if($hash -ne '4967C1FF7C79EE85ACE083467CDFE8C4FFF85B3B13A48EEE02B7D2EFF2088EC3'){throw 'Native executable mismatch'}
          New-Item -ItemType Directory -Force target/studio/src-tauri/target/debug | Out-Null
          Copy-Item native-binary/unsloth-studio.exe target/studio/src-tauri/target/debug/

      - name: "Verify retained old native app"
        shell: pwsh
        run: |
          $hash=(Get-FileHash native-binary/unsloth-studio-base.exe -Algorithm SHA256).Hash
          if($hash -ne '19A57D2BA8F1EA849CF6BFF45722F6BD4D426F8C6EF531D575F6EB343AB26DF1'){throw 'Baseline executable mismatch'}
          $proof=Get-Content native-binary/baseline-provenance.json -Raw | ConvertFrom-Json
          if($proof.source -ne '5c44c8c96b7fad0777cb6ea1240e5427f81e6fe4'){throw 'Baseline source mismatch'}

      - name: Retain exact executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-binary | Out-Null
          Copy-Item target/studio/src-tauri/target/debug/unsloth-studio.exe native-binary/
          @{target='70775b3bdf147d10e941306c17c25d51d98a4bca';sha256=(Get-FileHash native-binary/unsloth-studio.exe -Algorithm SHA256).Hash;configuration='cargo build --locked --no-default-features; TAURI_CONFIG adds direct browser debug argument; original window configuration preserved'} | ConvertTo-Json | Set-Content native-binary/provenance.json

      - name: Preserve exact executable for follow-up probes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9666-native-binary
          path: native-binary/
          retention-days: 7

      - name: "Native zoom acceptance"
        shell: pwsh
        run: |
          Set-Location target
          & .codex/pr9666/run-native.ps1

      - name: "Native retained-profile upgrade and rollback"
        shell: pwsh
        run: |
          Set-Location target
          & .codex/pr9666/run-legacy.ps1

      - name: Preserve scoped native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9666-native-scale
          path: target/native-evidence/
          if-no-files-found: warn
          retention-days: 7
