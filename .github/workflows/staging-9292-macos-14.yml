name: "staging-9292 macos-14"
on:
  push:
    branches: ["pr-9292-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/main.py'
      - 'studio/backend/routes/settings.py'
      - 'studio/backend/run.py'
      - 'studio/backend/tests/test_llama_cpp_darwin_loader_env.py'
      - 'studio/backend/tests/test_llama_cpp_path_settings.py'
      - 'studio/backend/tests/test_local_llama_cpp_link.py'
      - 'studio/backend/utils/llama_cpp_path_settings.py'
      - 'studio/backend/utils/llama_cpp_update.py'
      - 'studio/frontend/src/features/model-picker/components/model-selector/folder-browser.tsx'
      - 'studio/frontend/src/features/settings/api/llama-cpp-path.ts'
      - 'studio/frontend/src/features/settings/components/llama-backend-section.tsx'
      - 'studio/frontend/src/features/settings/hooks/use-llama-backend-switch.ts'
      - 'studio/frontend/src/i18n/locales/ar.ts'
      - 'studio/frontend/src/i18n/locales/de.ts'
      - 'studio/frontend/src/i18n/locales/en.ts'
      - 'studio/frontend/src/i18n/locales/es.ts'
      - 'studio/frontend/src/i18n/locales/fr.ts'
      - 'studio/frontend/src/i18n/locales/hi.ts'
      - 'studio/frontend/src/i18n/locales/it.ts'
      - '.github/workflows/staging-9292-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_llama_cpp_darwin_loader_env.py studio/backend/tests/test_llama_cpp_path_settings.py studio/backend/tests/test_local_llama_cpp_link.py -q --tb=short || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
