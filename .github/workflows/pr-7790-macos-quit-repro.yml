name: PR 7790 native macOS quit reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - pr-7790-conflict-resolution-v2-macos-ci-20260808

permissions:
  contents: read

concurrency:
  group: pr-7790-native-macos-quit
  cancel-in-progress: true

jobs:
  native-macos-lifecycle:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      BASE_SHA: 7556b12d6aae5e4a8bf62e17b7493e2f4b257ab4
      TARGET_SHA: 998d5ba7221d4886299c94449515435245dd0878
      ARTIFACTS: ${{ github.workspace }}/macos-quit-artifacts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1
        with:
          workspaces: studio/src-tauri -> target
          cache-on-failure: true

      - name: Preserve staging harness and fetch immutable revisions
        run: |
          mkdir -p "$RUNNER_TEMP/pr7790-ci" "$ARTIFACTS"
          cp .github/ci/pr7790/*.py "$RUNNER_TEMP/pr7790-ci/"
          git fetch --no-tags https://github.com/unslothai/unsloth.git "$BASE_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"

      - name: Install pinned JavaScript dependencies
        run: |
          npm ci --prefix studio --no-fund --no-audit
          npm ci --prefix studio/frontend --no-fund --no-audit

      - name: Build frontend once
        run: npm run --prefix studio/frontend build

      - name: Reproduce bug on base revision
        continue-on-error: true
        run: |
          git restore studio/src-tauri/src/main.rs studio/src-tauri/Cargo.toml studio/src-tauri/Cargo.lock
          git checkout --detach "$BASE_SHA"
          python3 "$RUNNER_TEMP/pr7790-ci/instrument_quit_ci.py" base
          npm ci --prefix studio --no-fund --no-audit
          npx --prefix studio tauri build --debug --bundles app \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          BASE_APP=studio/src-tauri/target/debug/bundle/macos/Unsloth.app
          test -n "$BASE_APP"
          python3 "$RUNNER_TEMP/pr7790-ci/run_macos_quit_probe.py" \
            --mode base --binary "$BASE_APP/Contents/MacOS/unsloth-studio" \
            --artifacts "$ARTIFACTS/base"

      - name: Validate conflict-resolved PR head on native macOS
        run: |
          git restore studio/src-tauri/src/main.rs studio/src-tauri/Cargo.toml studio/src-tauri/Cargo.lock
          git checkout --detach "$TARGET_SHA"
          python3 "$RUNNER_TEMP/pr7790-ci/instrument_quit_ci.py" target
          cargo fmt --manifest-path studio/src-tauri/Cargo.toml --check 2>&1 | tee "$ARTIFACTS/target-cargo-fmt.log" || true
          cargo test --manifest-path studio/src-tauri/Cargo.toml --no-fail-fast
          npx --prefix studio tauri build --debug --bundles app \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          TARGET_APP=studio/src-tauri/target/debug/bundle/macos/Unsloth.app
          test -n "$TARGET_APP"
          file "$TARGET_APP/Contents/MacOS/unsloth-studio" | tee "$ARTIFACTS/target-binary.txt"
          sw_vers | tee "$ARTIFACTS/macos-version.txt"
          uname -a | tee "$ARTIFACTS/uname.txt"
          python3 "$RUNNER_TEMP/pr7790-ci/run_macos_quit_probe.py" \
            --mode target --binary "$TARGET_APP/Contents/MacOS/unsloth-studio" \
            --artifacts "$ARTIFACTS/target"

      - name: Record immutable validation scope
        if: always()
        run: |
          printf 'base=%s\ntarget=%s\nrunner=%s\n' "$BASE_SHA" "$TARGET_SHA" "$RUNNER_OS" \
            > "$ARTIFACTS/scope.txt"
          git status --short > "$ARTIFACTS/final-git-status.txt"

      - name: Upload native macOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-7790-conflict-resolved-native-macos-evidence
          path: macos-quit-artifacts
          retention-days: 14
