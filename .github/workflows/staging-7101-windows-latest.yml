          python-version: "3.12"

      - name: "Install secret-free test dependencies"
        shell: bash
        run: |
          python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart

      - name: "Run exact-head Windows suite with base-equivalent exclusions"
        shell: bash
        run: |
          PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_bypass_permissions.py studio/backend/tests/test_sandbox.py studio/backend/tests/test_sandbox_profile_security.py studio/backend/tests/test_sandbox_warm_probe.py studio/backend/tests/test_tool_output_streaming.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda and not test_python_exec_mnt_data_open_is_remapped_into_workdir and not test_python_exec_pathlib_write_text_is_remapped_into_workdir'

