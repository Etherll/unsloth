# Disposable repro workflow. Delete after validation.

name: "PR 5603 lexical scope verification"

on:
  push:
    branches:
      - "pr-5603-scope-ci-20260901T070349Z"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused test dependencies"
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 structlog==25.4.0 huggingface-hub==1.23.0

      - name: "Run sandbox hardening and legacy classifier tests"
        shell: bash
        run: |
          python -m pytest studio/backend/tests/test_sandbox_hardening.py studio/backend/tests/test_sandbox_tools.py -q

      - name: "Run exact lexical scope probe and benchmark"
        shell: bash
        run: |
          python .github/pr5603_scope_probe.py
