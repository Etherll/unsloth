name: "staging-8883 windows-latest"
on:
  push:
    branches: ["pr-8883-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/tests/test_gpu_arch_gate_os_matrix_7624.py'
      - 'studio/backend/tests/test_host_offload_ram_guard.py'
      - 'studio/backend/tests/test_llama_cpp_placement.py'
      - '.github/workflows/staging-8883-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_gpu_arch_gate_os_matrix_7624.py studio/backend/tests/test_host_offload_ram_guard.py studio/backend/tests/test_llama_cpp_placement.py -q --tb=short || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
