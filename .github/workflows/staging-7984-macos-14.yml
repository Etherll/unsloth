name: "staging-7984 macos-14"
on:
  push:
    branches: ["pr-7984-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/audio_errors.py'
      - 'studio/backend/core/inference/audio_gallery.py'
      - 'studio/backend/core/inference/inference.py'
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/core/inference/llama_keepwarm.py'
      - 'studio/backend/core/inference/orchestrator.py'
      - 'studio/backend/core/inference/stt_ggml_sidecar.py'
      - 'studio/backend/core/inference/stt_mtmd_sidecar.py'
      - 'studio/backend/core/inference/stt_registry.py'
      - 'studio/backend/core/inference/stt_sidecar.py'
      - 'studio/backend/core/inference/worker.py'
      - 'studio/backend/hub/services/models/cache_inventory.py'
      - 'studio/backend/hub/tests/test_model_services.py'
      - 'studio/backend/main.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/settings.py'
      - 'studio/backend/tests/conftest.py'
      - 'studio/backend/tests/test_active_generations.py'
      - 'studio/backend/tests/test_audio_gallery.py'
      - '.github/workflows/staging-7984-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/hub/tests/test_model_services.py studio/backend/tests/test_active_generations.py studio/backend/tests/test_audio_gallery.py studio/backend/tests/test_audio_sampling_fill.py studio/backend/tests/test_audio_token_detection.py studio/backend/tests/test_audio_tts_cancellation.py studio/backend/tests/test_audio_unsupported_backend_error.py studio/backend/tests/test_cached_gguf_routes.py studio/backend/tests/test_hf_cache_dangling_refs.py studio/backend/tests/test_middleware.py studio/backend/tests/test_openai_audio_speech_route.py studio/backend/tests/test_openai_audio_transcriptions_route.py studio/backend/tests/test_openai_audio_upload_bound.py studio/backend/tests/test_orchestrator_unload_cancel.py studio/backend/tests/test_personalization_settings.py studio/backend/tests/test_stt_registry.py studio/backend/tests/test_stt_review_fixes.py studio/backend/tests/test_stt_review_fixes_3.py studio/backend/tests/test_stt_transcription_cancellation.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
