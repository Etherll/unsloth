name: "staging-9187 windows-latest"
on:
  push:
    branches: ["pr-9187-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/chat_generation_runs.py'
      - 'studio/backend/core/inference/llama_keepwarm.py'
      - 'studio/backend/core/inference/orchestrator.py'
      - 'studio/backend/main.py'
      - 'studio/backend/routes/__init__.py'
      - 'studio/backend/routes/chat_generation_runs.py'
      - 'studio/backend/routes/chat_history.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/state/active_generations.py'
      - 'studio/backend/storage/chat_generation_runs_db.py'
      - 'studio/backend/storage/studio_db.py'
      - 'studio/backend/tests/test_active_generations.py'
      - 'studio/backend/tests/test_chat_generation_runs.py'
      - 'studio/backend/tests/test_chat_generation_supervisor.py'
      - 'studio/backend/tests/test_chat_history_routes.py'
      - 'studio/backend/tests/test_chat_history_storage.py'
      - 'studio/backend/tests/test_openai_auto_switch.py'
      - 'studio/backend/tests/test_orchestrator_load_cancel_event.py'
      - 'studio/backend/tests/test_sandbox_files_and_storage_roots.py'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - '.github/workflows/staging-9187-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_active_generations.py studio/backend/tests/test_chat_generation_runs.py studio/backend/tests/test_chat_generation_supervisor.py studio/backend/tests/test_chat_history_routes.py studio/backend/tests/test_chat_history_storage.py studio/backend/tests/test_openai_auto_switch.py studio/backend/tests/test_orchestrator_load_cancel_event.py studio/backend/tests/test_sandbox_files_and_storage_roots.py tests/studio/test_stream_cancel_registration_timing.py -q --tb=short || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
