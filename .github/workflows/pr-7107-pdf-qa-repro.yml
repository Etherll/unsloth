# Disposable repro workflow. Delete after validation.

name: "PR 7107 PDF QA Repro"

on:
  push:
    branches:
      - "pr-7107-pdf-qa-repro-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.17.1"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused test dependency"
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: "Verify PDF QA review fixes"
        shell: bash
        run: |
          python -m pytest -q tests/studio/test_pdf_qa_recipe_contract.py

      - name: "Verify frontend types"
        shell: bash
        run: |
          cd studio/frontend
          npm ci
          npm run typecheck

