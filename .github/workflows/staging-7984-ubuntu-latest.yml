name: "staging-7984 ubuntu-latest"
on:
  push:
    branches: ["pr-7984-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/audio_errors.py'
      - 'studio/backend/core/inference/audio_gallery.py'
      - 'studio/backend/core/inference/inference.py'
      - 'studio/backend/core/inference/llama_keepwarm.py'
      - 'studio/backend/core/inference/orchestrator.py'
      - 'studio/backend/core/inference/worker.py'
      - 'studio/backend/hub/services/models/cache_inventory.py'
      - 'studio/backend/hub/tests/test_model_services.py'
      - 'studio/backend/main.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/settings.py'
      - 'studio/backend/tests/conftest.py'
      - 'studio/backend/tests/test_audio_gallery.py'
      - 'studio/backend/tests/test_audio_token_detection.py'
      - 'studio/backend/tests/test_audio_tts_cancellation.py'
      - 'studio/backend/tests/test_audio_unsupported_backend_error.py'
      - 'studio/backend/tests/test_middleware.py'
      - 'studio/backend/tests/test_openai_audio_speech_route.py'
      - 'studio/backend/tests/test_openai_audio_transcriptions_route.py'
      - '.github/workflows/staging-7984-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      # hub/tests/conftest.py intentionally installs lightweight module stubs.
      # Keep it in a separate process so those stubs cannot leak into route tests.
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/hub/tests/test_model_services.py -q --tb=short
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_audio_gallery.py studio/backend/tests/test_audio_token_detection.py studio/backend/tests/test_audio_tts_cancellation.py studio/backend/tests/test_audio_unsupported_backend_error.py studio/backend/tests/test_middleware.py studio/backend/tests/test_openai_audio_speech_route.py studio/backend/tests/test_openai_audio_transcriptions_route.py studio/backend/tests/test_openai_audio_upload_bound.py studio/backend/tests/test_orchestrator_unload_cancel.py studio/backend/tests/test_personalization_settings.py studio/backend/tests/test_stt_review_fixes.py -q --tb=short
